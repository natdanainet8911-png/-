<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#120d0a">
<title>Boba Lab — ชานมไข่มุก</title>
<meta name="description" content="ผสม เขย่า เจาะฟิล์ม แล้วดูดชานมไข่มุกของคุณเอง เล่นได้ทั้งมือถือและคอม">
<meta property="og:title" content="Boba Lab — ชานมไข่มุก">
<meta property="og:description" content="ออกแบบแก้วของคุณเอง แล้วส่งสูตรให้เพื่อน">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%8B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ══════════════ TOKENS ══════════════ */
:root{
  --bg0:#0d0907; --bg1:#1c1310; --bg2:#241913;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#f7f1e6; --dim:#a89b8d; --gold:#ffc46b; --acc:#6ee7ff; --ok:#7ee0a8; --warn:#ff8a7a;
  --r1:10px; --r2:14px; --r3:22px; --tap:44px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.22,1,.36,1);
  --fs-xs:clamp(10px,2.3vw,12px); --fs-sm:clamp(12px,2.7vw,13.5px);
  --fs-md:clamp(14px,3vw,15.5px); --fs-lg:clamp(17px,4vw,21px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg1) 45%,var(--bg0));
  color:var(--ink); font-family:"Noto Sans Thai",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs-md); line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
/* กันตัวอักษรพลิก/ตะแคงทุกกรณี */
body,body *{writing-mode:horizontal-tb;text-orientation:mixed;direction:ltr;unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ══════════════ LAYOUT ══════════════ */
#app{
  display:grid; height:100vh; height:100svh; height:100dvh;
  grid-template-columns:minmax(0,1fr) 382px;
  grid-template-rows:58px minmax(0,1fr);
  grid-template-areas:"hud hud" "stage panel";
  padding:var(--st) var(--sr) var(--sb) var(--sl);
}
#hud{grid-area:hud;display:flex;align-items:center;gap:var(--sp3);padding:0 var(--sp4);
  border-bottom:1px solid var(--line);background:rgba(13,9,7,.7);backdrop-filter:blur(12px) saturate(1.3);
  -webkit-backdrop-filter:blur(12px) saturate(1.3);position:relative;z-index:20}
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
#stage:active{cursor:grabbing}
#cv{display:block;width:100%;height:100%}
#panel{grid-area:panel;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;border-left:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0));
  padding:var(--sp4) var(--sp4) calc(var(--sp5) + var(--sb));scrollbar-width:thin}
#panel::-webkit-scrollbar{width:6px}
#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}

/* ══════════════ HUD ══════════════ */
.logo{font-weight:700;letter-spacing:.2px;white-space:nowrap;font-size:var(--fs-md)}
.logo b{color:var(--gold)}
.meter{flex:1;min-width:60px;max-width:300px;height:10px;border-radius:99px;
  background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.meter i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),#ffe6b3);transition:width .18s var(--ease)}
#mTxt{font-size:var(--fs-sm);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.sp{flex:1}
.ib{width:var(--tap);height:var(--tap);display:grid;place-items:center;border:1px solid var(--line);
  background:rgba(255,255,255,.05);border-radius:var(--r1);cursor:pointer;transition:.15s var(--ease)}
.ib:active{transform:scale(.94)}
@media(hover:hover){.ib:hover{background:rgba(255,255,255,.12)}}

/* ══════════════ STAGE OVERLAYS ══════════════ */
#tip{position:absolute;left:50%;top:var(--sp3);translate:-50% 0;padding:7px 15px;border-radius:99px;
  background:rgba(0,0,0,.5);border:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .25s var(--ease);max-width:92%;overflow:hidden;text-overflow:ellipsis}
#tip.on{opacity:1}
#combo{position:absolute;right:var(--sp4);top:50%;translate:0 -50%;text-align:center;pointer-events:none;
  opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#comboNum{display:block;font-size:clamp(30px,7vw,52px);font-weight:700;color:var(--gold);
  line-height:1;text-shadow:0 0 24px rgba(255,196,107,.5);font-variant-numeric:tabular-nums}
#combo span{font-size:var(--fs-xs);letter-spacing:3px;color:var(--dim)}
#combo.pop #comboNum{animation:pop .3s var(--ease)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

#ringWrap{position:absolute;left:50%;bottom:calc(var(--sp5) + 78px);translate:-50% 0;width:88px;height:88px;
  opacity:0;transition:opacity .22s var(--ease);pointer-events:none}
#ringWrap.on{opacity:1}
#ring{width:100%;height:100%}
#ring circle{fill:none;stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
#ring .bg{stroke:rgba(255,255,255,.13)}
#ring .arc{stroke:var(--acc);stroke-dasharray:276.5;stroke-dashoffset:276.5;transition:stroke-dashoffset .08s linear}
#ringTxt{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--fs-sm);font-weight:700}

#actWrap{position:absolute;left:0;right:0;bottom:var(--sp4);display:flex;justify-content:center;
  padding:0 var(--sp4);pointer-events:none;z-index:10}
#act{pointer-events:auto}

/* ลอยคำชม — ไม่หมุน ไม่พลิก */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fw{position:absolute;translate:-50% 0;font-weight:700;font-size:var(--fs-lg);white-space:nowrap;
  text-shadow:0 2px 10px rgba(0,0,0,.6);animation:fw 1s var(--ease) forwards}
@keyframes fw{0%{opacity:0;transform:translateY(6px) scale(.8)}18%{opacity:1}
  100%{opacity:0;transform:translateY(-86px) scale(1.06)}}

/* ══════════════ BUTTONS ══════════════ */
.btn{min-height:var(--tap);min-width:var(--tap);padding:0 var(--sp5);display:inline-flex;align-items:center;
  justify-content:center;gap:var(--sp2);border:1px solid var(--line2);border-radius:var(--r2);
  background:rgba(255,255,255,.07);font-weight:600;cursor:pointer;
  transition:transform .14s var(--ease),filter .2s,background .2s}
.btn:active{transform:scale(.96)}
@media(hover:hover){.btn:hover{background:rgba(255,255,255,.14)}}
.btn.primary{background:linear-gradient(135deg,var(--gold),#ffab3d);color:#20140a;border-color:transparent;
  box-shadow:0 8px 22px rgba(255,170,60,.28)}
.btn.wide{width:100%}
.btn.lg{font-size:var(--fs-lg);min-height:54px;border-radius:var(--r3)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.hold{position:relative;overflow:hidden}
.btn.hold::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.3);
  transform:scaleX(var(--p,0));transform-origin:left;transition:transform .08s linear}
:where(button,a,input,[tabindex]):focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ══════════════ PANEL ══════════════ */
.sec{margin-bottom:var(--sp5)}
.sec h3{font-size:var(--fs-sm);letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);
  margin-bottom:var(--sp3);font-weight:600}
.grid{display:grid;gap:var(--sp2)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(74px,1fr))}
.chip{min-height:var(--tap);padding:var(--sp2) var(--sp3);border:1px solid var(--line);border-radius:var(--r1);
  background:rgba(255,255,255,.04);cursor:pointer;text-align:center;font-size:var(--fs-sm);line-height:1.25;
  transition:.16s var(--ease);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.chip:active{transform:scale(.95)}
@media(hover:hover){.chip:hover{background:rgba(255,255,255,.1);border-color:var(--line2)}}
.chip.on{background:rgba(255,196,107,.16);border-color:var(--gold);color:var(--gold);font-weight:600}
.chip .sub{font-size:var(--fs-xs);color:var(--dim);font-weight:400}
.chip.on .sub{color:rgba(255,196,107,.75)}
.chip .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.35) inset}

.steps{display:flex;gap:var(--sp1);margin-bottom:var(--sp4);background:rgba(255,255,255,.04);
  padding:4px;border-radius:var(--r2);border:1px solid var(--line)}
.steps button{flex:1;min-height:38px;border:0;background:transparent;border-radius:var(--r1);
  font-size:var(--fs-xs);color:var(--dim);cursor:pointer;transition:.16s var(--ease);font-weight:600}
.steps button.on{background:rgba(255,196,107,.18);color:var(--gold)}

.bill{position:sticky;bottom:calc(-1 * var(--sp2));margin:0 calc(-1 * var(--sp4)) calc(-1 * var(--sp5));
  padding:var(--sp3) var(--sp4) calc(var(--sp4) + var(--sb));
  background:linear-gradient(180deg,rgba(13,9,7,.6),rgba(13,9,7,.96));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
.billRow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--sp3);gap:var(--sp3)}
.price{font-size:clamp(22px,5.5vw,30px);font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.kcal{font-size:var(--fs-sm);color:var(--dim)}

.card{border:1px solid var(--line);border-radius:var(--r2);padding:var(--sp4);
  background:rgba(255,255,255,.04);margin-bottom:var(--sp3)}
.row{display:flex;justify-content:space-between;gap:var(--sp3);padding:6px 0;font-size:var(--fs-sm)}
.row+.row{border-top:1px dashed var(--line)}
.row b{font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
.banner{border:1px solid rgba(110,231,255,.35);background:rgba(110,231,255,.1);border-radius:var(--r2);
  padding:var(--sp3);margin-bottom:var(--sp4);font-size:var(--fs-sm);display:none}
.banner.on{display:block}
.hidden{display:none !important}

/* ══════════════ MODAL ══════════════ */
dialog{border:1px solid var(--line2);border-radius:var(--r3);background:var(--bg1);color:var(--ink);
  padding:var(--sp5);max-width:min(440px,92vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.66);backdrop-filter:blur(4px)}
.inp{width:100%;min-height:var(--tap);padding:var(--sp3);border:1px solid var(--line);border-radius:var(--r1);
  background:rgba(0,0,0,.35);font-size:16px;margin-bottom:var(--sp3)}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 22px);translate:-50% 0;padding:11px 20px;
  border-radius:99px;background:rgba(20,14,10,.95);border:1px solid var(--line2);font-size:var(--fs-sm);
  z-index:99;opacity:0;pointer-events:none;transition:opacity .22s,translate .22s var(--ease)}
#toast.on{opacity:1;translate:-50% -8px}

/* ══════════════ BOOT ══════════════ */
#boot{position:fixed;inset:0;display:grid;place-items:center;gap:var(--sp3);z-index:200;
  background:var(--bg0);transition:opacity .4s var(--ease)}
#boot.off{opacity:0;pointer-events:none}
#boot .em{font-size:56px;animation:bob 1.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ══════════════ RESPONSIVE ══════════════ */
@media(min-width:1440px){#app{grid-template-columns:minmax(0,1fr) 420px}#panel{padding:var(--sp5)}}
@media(max-width:1100px){#app{grid-template-columns:minmax(0,1fr) 330px}}
@media(max-width:920px){
  #app{grid-template-columns:1fr;grid-template-rows:54px minmax(38svh,42svh) minmax(0,1fr);
    grid-template-areas:"hud" "stage" "panel"}
  #panel{border-left:0;border-top:1px solid var(--line);border-radius:var(--r3) var(--r3) 0 0;
    padding:var(--sp4) var(--sp3) calc(var(--sp5) + var(--sb));margin-top:-18px;position:relative;z-index:15;
    background:linear-gradient(180deg,var(--bg2),var(--bg1));box-shadow:0 -14px 34px rgba(0,0,0,.45)}
  .bill{margin-inline:calc(-1 * var(--sp3));padding-inline:var(--sp3)}
  #combo{right:var(--sp3)}
}
@media(max-width:600px){
  #app{grid-template-rows:52px minmax(34svh,39svh) minmax(0,1fr)}
  #mTxt{display:none}
  #ringWrap{bottom:calc(var(--sp3) + 70px);width:76px;height:76px}
}
@media(max-height:540px) and (orientation:landscape){
  #app{grid-template-columns:minmax(0,1fr) minmax(280px,38vw);grid-template-rows:46px minmax(0,1fr);
    grid-template-areas:"hud hud" "stage panel"}
  #panel{border-top:0;border-left:1px solid var(--line);border-radius:0;margin-top:0;box-shadow:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="boot"><div class="em">🧋</div><div class="muted">กำลังเตรียมแก้ว…</div></div>

<div id="app">
  <header id="hud">
    <div class="logo">🧋 <b>Boba</b> Lab</div>
    <div class="meter" role="progressbar" aria-label="ความคืบหน้า"><i id="mBar"></i></div>
    <div id="mTxt">เลือกสูตร</div>
    <div class="sp"></div>
    <button class="ib" id="btnSfx" aria-label="เปิด/ปิดเสียง">🔊</button>
    <button class="ib" id="btnReset" aria-label="เริ่มใหม่">↺</button>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="fx"></div>
    <div id="tip"></div>
    <div id="combo"><b id="comboNum">0</b><span>COMBO</span></div>
    <div id="ringWrap">
      <svg id="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="bg" cx="50" cy="50" r="44"/><circle class="arc" cx="50" cy="50" r="44"/>
      </svg>
      <div id="ringTxt"></div>
    </div>
    <div id="actWrap"><button class="btn primary lg" id="act">ปิดฝา &amp; เขย่า</button></div>
  </main>

  <aside id="panel">
    <div class="banner" id="banner">📩 เพื่อนส่งสูตรนี้มาให้คุณ — กด <b>เริ่ม</b> ได้เลย</div>

    <!-- ───── โหมดสร้างแก้ว ───── -->
    <div id="build">
      <div class="steps" id="steps"></div>
      <div id="panes"></div>
    </div>

    <!-- ───── โหมดเล่น ───── -->
    <div id="play" class="hidden">
      <div class="card">
        <h3 style="margin-bottom:8px" id="playTitle">เขย่าให้เข้ากัน</h3>
        <p class="muted" id="playDesc" style="font-size:var(--fs-sm)"></p>
      </div>
      <div class="card" id="liveStats"></div>
    </div>

    <!-- ───── สรุป ───── -->
    <div id="done" class="hidden">
      <div class="card" id="receipt"></div>
      <div class="grid g2" style="margin-bottom:12px">
        <button class="btn" id="btnShare">🔗 แชร์สูตร</button>
        <button class="btn" id="btnDeliver">🛵 สั่งจริง</button>
      </div>
      <div class="card hidden" id="deliverBox"></div>
      <button class="btn primary wide" id="btnAgain">ทำแก้วใหม่</button>
    </div>

    <!-- ───── บิล ───── -->
    <div class="bill" id="bill">
      <div class="billRow">
        <div><div class="price" id="pPrice">฿0</div><div class="kcal" id="pKcal">0 kcal</div></div>
        <div style="text-align:right;font-size:var(--fs-xs)" class="muted" id="pName">—</div>
      </div>
      <button class="btn primary wide lg" id="btnGo">ปิดฝา &amp; เขย่า</button>
    </div>
  </aside>
</div>

<dialog id="modal">
  <h2 style="font-size:var(--fs-lg);margin-bottom:12px">🔗 แชร์สูตรนี้</h2>
  <p class="muted" style="font-size:var(--fs-sm);margin-bottom:12px">ส่งลิงก์นี้ให้เพื่อน เขาจะได้แก้วสูตรเดียวกันเป๊ะ</p>
  <input class="inp" id="shLink" readonly>
  <div class="grid g2">
    <button class="btn" id="shClose">ปิด</button>
    <button class="btn primary" id="shCopy">คัดลอก</button>
  </div>
</dialog>

<div id="toast"></div>
<noscript><p style="padding:24px">ต้องเปิด JavaScript เพื่อเล่นครับ</p></noscript>

<script>
"use strict";
(() => {
/* ═════════════════════ 1. CONFIG ═════════════════════ */
const FLAVORS = [
  {n:"ชานมไข่มุกคลาสสิก", c:"#c79a6d", d:"#8a5f38", p:40, k:280, e:"🧋"},
  {n:"ชาไทยเย็น",        c:"#e8903a", d:"#b4601a", p:45, k:320, e:"🇹🇭"},
  {n:"บราวน์ชูการ์",      c:"#9c6534", d:"#5d3517", p:55, k:380, e:"🍯"},
  {n:"มัทฉะลาเต้",        c:"#8bb069", d:"#4f7038", p:55, k:300, e:"🍵"},
  {n:"โกโก้เข้ม",         c:"#7d5233", d:"#472a16", p:50, k:350, e:"🍫"},
  {n:"ชาเขียวนม",        c:"#a9c98a", d:"#6b8f4e", p:45, k:270, e:"🌿"},
  {n:"นมสดโอริโอ้",      c:"#e6ded2", d:"#5a5148", p:55, k:400, e:"🖤"},
  {n:"เผือกหอม",         c:"#b294d4", d:"#7a5aa3", p:55, k:340, e:"💜"},
  {n:"สตรอว์เบอร์รี",     c:"#e8768a", d:"#b23a52", p:50, k:290, e:"🍓"},
  {n:"ลิ้นจี่โซดา",       c:"#f2c0cb", d:"#c98c9c", p:50, k:210, e:"🌸"},
  {n:"กาแฟนมสด",        c:"#8a5f38", d:"#4d3320", p:50, k:260, e:"☕"},
  {n:"อู่หลงนม",         c:"#c9ad83", d:"#8a7048", p:48, k:250, e:"🍂"},
];
const SIZES = [
  {n:"S", o:"16 oz", m:1.00, a:0},
  {n:"M", o:"22 oz", m:1.25, a:10},
  {n:"L", o:"32 oz", m:1.60, a:20},
  {n:"XL",o:"1 ลิตร",m:2.20, a:35},
];
const SWEET = [0,25,50,75,100,125];
const ICE   = [{n:"ไม่ใส่",v:0},{n:"น้อย",v:.35},{n:"ปกติ",v:.7},{n:"เยอะ",v:1}];
const TOPS = [
  {n:"ไข่มุก",      p:10, k:120, e:"⚫", pearl:true},
  {n:"บุกใส",      p:10, k:25,  e:"⚪", pearl:true, col:"#e9f2f5"},
  {n:"เยลลี่ลิ้นจี่", p:10, k:60,  e:"🩷", pearl:true, col:"#f4b9c8"},
  {n:"พุดดิ้งไข่",   p:15, k:90,  e:"🟡", pearl:true, col:"#f7d97a"},
  {n:"ครีมชีส",     p:20, k:110, e:"🧀", foam:true},
  {n:"ถั่วแดง",     p:15, k:100, e:"🔴", pearl:true, col:"#8f3a3a"},
  {n:"วิปครีม",     p:15, k:80,  e:"☁️", foam:true},
  {n:"เม็ดแมงลัก",  p:5,  k:15,  e:"🌱", pearl:true, col:"#2f3a2a", small:true},
];
const PRAISE = ["หนึบ!","ฟิน!","เด้ง!","อร่อย!","ปัง!","ชื่นใจ!","เต็มคำ!","สุดยอด!"];

/* ═════════════════════ 2. STATE ═════════════════════ */
const S = {
  step:0, flavor:0, size:1, sweet:3, ice:2, tops:new Set([0]),
  phase:"build",          // build | shake | pierce | sip | done
  mix:0, pierceP:0, fill:1,
  combo:0, comboBest:0, comboT:0, eaten:0, hold:false,
  sipPow:0, t:0, shakeReady:false,
  stats: JSON.parse(localStorage.getItem("bobaStats")||"null") || {cups:0,best:0,kcal:0,spent:0},
};
const sh = {e:0, vx:0, tilt:0, rev:0, dir:0, last:0};

/* ═════════════════════ 3. HELPERS ═════════════════════ */
const $ = s => document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t*t*(3-2*t);
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixHex=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);
  return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(",")})`};
const reduceMo = matchMedia("(prefers-reduced-motion:reduce)").matches;

const activeTops = () => [...S.tops].map(i=>TOPS[i]);
function priceOf(){
  const f=FLAVORS[S.flavor], z=SIZES[S.size];
  return Math.round(f.p*z.m + z.a + activeTops().reduce((s,t)=>s+t.p,0));
}
function kcalOf(){
  const f=FLAVORS[S.flavor], z=SIZES[S.size];
  const sw=0.5+SWEET[S.sweet]/100*0.5;
  return Math.round((f.k*z.m*sw + activeTops().reduce((s,t)=>s+t.k,0))*(1-ICE[S.ice].v*0.08));
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1800);}
function float(txt,x,y,col){
  if(reduceMo) return;
  const s=document.createElement("span");
  s.className="fw"; s.textContent=txt; s.style.left=x+"px"; s.style.top=y+"px";
  s.style.color=col||"var(--gold)";
  $("#fx").appendChild(s); setTimeout(()=>s.remove(),1050);
}

/* ═════════════════════ 4. AUDIO ═════════════════════ */
const Snd = (()=>{
  let ctx=null, noise=null, on=true, sipSrc=null, sipGain=null;
  function init(){
    if(ctx) return ctx;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const len=ctx.sampleRate*1.2, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    noise=buf; return ctx;
  }
  const g=(v,t)=>{const n=ctx.createGain();n.gain.setValueAtTime(v,t);return n};
  function burst(dur,f,q,vol){
    if(!on||!init()) return; const t=ctx.currentTime;
    const s=ctx.createBufferSource(); s.buffer=noise;
    const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=f; bp.Q.value=q;
    const gn=g(vol,t); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(bp).connect(gn).connect(ctx.destination); s.start(t); s.stop(t+dur);
  }
  function tone(f0,f1,dur,vol,type){
    if(!on||!init()) return; const t=ctx.currentTime;
    const o=ctx.createOscillator(); o.type=type||"sine";
    o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    const gn=g(vol,t); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(gn).connect(ctx.destination); o.start(t); o.stop(t+dur);
  }
  return {
    init, toggle(){on=!on; if(!on&&sipGain)sipGain.gain.value=0; return on},
    get on(){return on},
    shake(){burst(.10,rnd(900,1600),1.4,.10)},
    pop(){tone(680,180,.14,.22,"triangle")},
    blop(n){tone(420+n*22,900+n*30,.10,.14,"sine")},
    ding(){tone(880,1320,.28,.16,"sine"); setTimeout(()=>tone(1320,1760,.3,.12,"sine"),90)},
    sipStart(){ if(!on||!init()||sipSrc) return;
      const s=ctx.createBufferSource(); s.buffer=noise; s.loop=true;
      const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1100; bp.Q.value=2.2;
      sipGain=ctx.createGain(); sipGain.gain.value=0;
      s.connect(bp).connect(sipGain).connect(ctx.destination); s.start(); sipSrc=s;
    },
    sipLevel(v){ if(sipGain) sipGain.gain.value=(on?v*0.13:0) },
    sipStop(){ try{sipSrc&&sipSrc.stop()}catch(e){} sipSrc=null; sipGain=null; },
  };
})();

/* ═════════════════════ 5. CANVAS ═════════════════════ */
const cv=$("#cv"), ctx=cv.getContext("2d",{alpha:true});
const L={cx:0,top:0,bot:0,h:0,rt:0,rb:0,w:0,H:0};
let pearls=[], ices=[], bubbles=[];

function fit(){
  const r=cv.getBoundingClientRect(); if(!r.width||!r.height) return;
  const dpr=Math.min(devicePixelRatio||1, innerWidth<820?2:2.5);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  L.w=r.width; L.H=r.height;
  L.h=Math.min(r.height*0.74, r.width*1.28);
  L.cx=r.width/2; L.top=r.height*0.5-L.h*0.54; L.bot=L.top+L.h;
  L.rt=L.h*0.30; L.rb=L.h*0.215;
}
new ResizeObserver(()=>fit()).observe($("#stage"));
addEventListener("orientationchange",()=>setTimeout(fit,260));

const radAt=y=>lerp(L.rt,L.rb,clamp((y-L.top)/L.h,0,1));
const surfY=()=>lerp(L.bot-8, L.top+L.h*0.075, clamp(S.fill,0,1));

function cupPath(p=0){
  ctx.beginPath();
  ctx.moveTo(L.cx-L.rt+p, L.top);
  ctx.lineTo(L.cx+L.rt-p, L.top);
  ctx.lineTo(L.cx+L.rb-p, L.bot-p*0.6);
  ctx.quadraticCurveTo(L.cx, L.bot+L.rb*0.2-p, L.cx-L.rb+p, L.bot-p*0.6);
  ctx.closePath();
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ── ไข่มุก / น้ำแข็ง ── */
function buildPearls(){
  pearls=[]; ices=[];
  const list=activeTops().filter(t=>t.pearl);
  if(!list.length) return;
  const n=Math.round(clamp(9*SIZES[S.size].m,6,13))*list.length;
  for(let i=0;i<Math.min(n,44);i++){
    const t=list[i%list.length];
    const r=(t.small?L.h*0.013:L.h*0.026)*rnd(.86,1.14);
    pearls.push({
      x:L.cx+rnd(-L.rb*.6,L.rb*.6), y:L.bot-rnd(6,L.h*.26),
      vx:0, vy:0, r, col:t.col||"#2a1a12", gone:0, suck:0
    });
  }
  const ic=Math.round(ICE[S.ice].v*7);
  for(let i=0;i<ic;i++)
    ices.push({x:L.cx+rnd(-L.rt*.55,L.rt*.55), y:rnd(0,1), rot:rnd(0,6.28), s:L.h*rnd(.035,.055), ph:rnd(0,6.28)});
}

function stepPearls(dt){
  const G=L.h*2.4, sy=surfY(), wall=L.h*0.012;
  for(const p of pearls){
    if(p.gone) continue;
    if(p.suck>0){                              // กำลังถูกดูดเข้าหลอด
      p.suck+=dt*3.4;
      const tx=L.cx+L.h*0.055, ty=lerp(p.y0, L.top-L.h*0.1, ease(clamp(p.suck,0,1)));
      p.x=lerp(p.x0,tx,ease(clamp(p.suck,0,1))); p.y=ty;
      if(p.suck>=1){ p.gone=1; onEat(p); }
      continue;
    }
    const sub = p.y > sy;                       // จมอยู่ในน้ำ?
    p.vy += G*dt*(sub?0.35:1);                  // ในน้ำ = ลอยตัว
    p.vx *= sub?0.94:0.985; p.vy *= sub?0.93:0.995;
    p.vx += sh.vx*dt*2.6*(sub?1:.6);
    p.x+=p.vx*dt; p.y+=p.vy*dt;

    const maxR=radAt(p.y)-p.r-wall;
    if(Math.abs(p.x-L.cx)>maxR){
      p.x=L.cx+Math.sign(p.x-L.cx)*maxR; p.vx*=-0.42;
    }
    const fy=L.bot-p.r-wall;
    if(p.y>fy){ p.y=fy; p.vy*=-0.24; if(Math.abs(p.vy)<20) p.vy=0; }
    if(p.y<L.top+p.r){ p.y=L.top+p.r; p.vy*=-0.3; }
  }
  // ชนกันเอง (กองซ้อนสวยๆ)
  for(let i=0;i<pearls.length;i++){
    const a=pearls[i]; if(a.gone||a.suck) continue;
    for(let j=i+1;j<pearls.length;j++){
      const b=pearls[j]; if(b.gone||b.suck) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), m=a.r+b.r;
      if(d>0&&d<m){
        const o=(m-d)/d*0.5, ox=dx*o, oy=dy*o;
        a.x-=ox;a.y-=oy;b.x+=ox;b.y+=oy;
        a.vx-=ox*9;a.vy-=oy*9;b.vx+=ox*9;b.vy+=oy*9;
      }
    }
  }
}
function onEat(p){
  S.eaten++;
  const now=S.t;
  S.combo = (now-S.comboT<1.3) ? S.combo+1 : 1;
  S.comboT=now; S.comboBest=Math.max(S.comboBest,S.combo);
  Snd.blop(Math.min(S.combo,14));
  const c=$("#combo"); c.classList.add("on","pop"); setTimeout(()=>c.classList.remove("pop"),300);
  $("#comboNum").textContent=S.combo;
  if(S.combo%3===0) float(PRAISE[(S.combo/3|0)%PRAISE.length], L.cx, surfY()-30, "var(--gold)");
}

/* ── หลอด ── */
function strawGeo(){
  const inY = lerp(L.top-L.h*0.30, L.top+L.h*0.14, ease(clamp(S.pierceP,0,1)));
  return {x:L.cx+L.h*0.055, topY:inY-L.h*0.62, botY:S.phase==="build"||S.phase==="shake"?inY:L.bot-L.h*0.06,
          y:inY, w:L.h*0.045, tilt:-0.075};
}

/* ═════════════════════ 6. DRAW ═════════════════════ */
function draw(){
  const f=FLAVORS[S.flavor], W=L.w, H=L.H;
  ctx.clearRect(0,0,W,H);

  /* พื้นหลัง */
  const bg=ctx.createRadialGradient(W*.5,H*.18,10,W*.5,H*.6,Math.max(W,H)*.8);
  bg.addColorStop(0, mixHex("#241913",f.c,.14)); bg.addColorStop(1,"#0d0907");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.16; ctx.fillStyle=f.c;
  ctx.beginPath(); ctx.arc(W*.2,H*.78,L.h*.42,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(W*.84,H*.2,L.h*.3,0,7); ctx.fill(); ctx.globalAlpha=1;

  /* เงา */
  ctx.save(); ctx.globalAlpha=.4; ctx.fillStyle="#000"; ctx.filter="blur(10px)";
  ctx.beginPath(); ctx.ellipse(L.cx,L.bot+L.h*.06,L.rb*1.25,L.h*.035,0,0,7); ctx.fill(); ctx.restore();

  /* เอียงแก้วตามแรงเขย่า (ไม่มีตัวอักษรอยู่ในนี้) */
  ctx.save();
  ctx.translate(L.cx, L.bot); ctx.rotate(sh.tilt); ctx.translate(-L.cx,-L.bot);

  /* ผนังหลัง */
  ctx.save(); cupPath(0);
  const wall=ctx.createLinearGradient(L.cx-L.rt,0,L.cx+L.rt,0);
  wall.addColorStop(0,"rgba(255,255,255,.14)"); wall.addColorStop(.42,"rgba(255,255,255,.04)");
  wall.addColorStop(1,"rgba(255,255,255,.11)");
  ctx.fillStyle=wall; ctx.fill(); ctx.restore();

  /* น้ำ */
  ctx.save(); cupPath(L.h*0.012); ctx.clip();
  const sy=surfY();
  const amp=(2+sh.e*24+S.sipPow*7)*(reduceMo?0.2:1);
  const off=sh.tilt*L.rt*1.9;
  const x0=L.cx-L.rt-14, x1=L.cx+L.rt+14;
  ctx.beginPath(); ctx.moveTo(x0,L.bot+L.h);
  for(let x=x0;x<=x1;x+=5){
    const t=(x-x0)/(x1-x0);
    const y=sy+Math.sin(t*6.4+S.t*3.2)*amp+Math.sin(t*3.2-S.t*2.1)*amp*.55+off*(t-.5)*2;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(x1,L.bot+L.h); ctx.closePath();

  const base=mixHex(f.d, mixHex(f.c,"#f4e8d6",.34), S.mix);
  const lg=ctx.createLinearGradient(0,sy,0,L.bot);
  lg.addColorStop(0, base); lg.addColorStop(1, mixHex(base,"#000",.22));
  ctx.fillStyle=lg; ctx.fill();

  /* ชั้นนมที่ยังไม่ผสม */
  if(S.mix<1){
    ctx.save(); ctx.globalAlpha=(1-S.mix)*.9;
    const band=ctx.createLinearGradient(0,sy,0,sy+L.h*.34);
    band.addColorStop(0,"#f6ecdc"); band.addColorStop(.55,"rgba(246,236,220,.82)");
    band.addColorStop(1,"rgba(246,236,220,0)");
    ctx.fillStyle=band; ctx.fill(); ctx.restore();
  }
  /* ฟองจากการเขย่า */
  if(sh.e>.05){
    ctx.globalAlpha=clamp(sh.e,0,.5); ctx.fillStyle="rgba(255,255,255,.7)";
    for(let i=0;i<14;i++){
      const t=(i/14+S.t*.28)%1, bx=L.cx+Math.sin(i*2.3+S.t*2)*L.rt*.62;
      ctx.beginPath(); ctx.arc(bx, lerp(L.bot,sy,t), L.h*.006*(1+t), 0, 7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  /* น้ำแข็ง */
  for(const ic of ices){
    const y=lerp(sy+L.h*.03, L.bot-L.h*.06, ic.y)+Math.sin(S.t*1.5+ic.ph)*3;
    if(y<sy) continue;
    ctx.save(); ctx.translate(ic.x+Math.sin(S.t+ic.ph)*sh.e*22, y);
    ctx.rotate(ic.rot+sh.tilt*.6); ctx.globalAlpha=.5;
    ctx.fillStyle="#dff2ff"; rrect(-ic.s/2,-ic.s/2,ic.s,ic.s,ic.s*.24); ctx.fill();
    ctx.globalAlpha=.28; ctx.fillStyle="#fff"; rrect(-ic.s/2+2,-ic.s/2+2,ic.s*.38,ic.s*.38,3); ctx.fill();
    ctx.restore();
  }
  /* ไข่มุก */
  for(const p of pearls){
    if(p.gone) continue;
    ctx.save(); ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7);
    const pg=ctx.createRadialGradient(p.x-p.r*.34,p.y-p.r*.4,p.r*.12,p.x,p.y,p.r);
    pg.addColorStop(0,mixHex(p.col,"#ffffff",.42)); pg.addColorStop(1,p.col);
    ctx.fillStyle=pg; ctx.fill();
    ctx.globalAlpha=.5; ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(p.x-p.r*.32,p.y-p.r*.36,p.r*.24,0,7); ctx.fill();
    ctx.restore();
  }
  /* โฟม/ครีม */
  if(activeTops().some(t=>t.foam) && S.fill>.05){
    ctx.save(); ctx.globalAlpha=.92; ctx.fillStyle="#fbf3e6";
    ctx.beginPath(); ctx.moveTo(x0,sy+2);
    for(let x=x0;x<=x1;x+=9){
      const t=(x-x0)/(x1-x0);
      ctx.lineTo(x, sy-L.h*.028+Math.sin(t*9+S.t)*3+off*(t-.5)*2);
    }
    ctx.lineTo(x1,sy+L.h*.03); ctx.lineTo(x0,sy+L.h*.03); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.restore(); // unclip

  /* หลอด */
  const st=strawGeo();
  if(S.phase!=="build"){
    ctx.save(); ctx.translate(st.x,st.y); ctx.rotate(st.tilt); ctx.translate(-st.x,-st.y);
    const h=st.botY-st.topY;
    ctx.fillStyle="#f24e5c"; rrect(st.x-st.w/2, st.topY, st.w, h, st.w/2); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.85)";
    for(let i=0;i<9;i++){const yy=st.topY+i*(h/9); if(yy>st.botY-6)break;
      ctx.fillRect(st.x-st.w/2, yy, st.w, Math.min(h/22,h-(yy-st.topY)));}
    if(S.phase==="sip"||S.phase==="done"){        // น้ำในหลอด
      const col=lerp(st.botY, st.topY+h*.1, ease(S.sipPow));
      ctx.fillStyle=base; ctx.globalAlpha=.9;
      rrect(st.x-st.w/2+2, col, st.w-4, st.botY-col, st.w/2); ctx.fill(); ctx.globalAlpha=1;
    }
    ctx.fillStyle="rgba(0,0,0,.18)"; rrect(st.x+st.w*.16,st.topY,st.w*.34,h,st.w/2); ctx.fill();
    ctx.restore();
  }

  /* ฝาฟิล์ม */
  if(S.phase==="build"||S.phase==="shake"||(S.phase==="pierce"&&S.pierceP<1)){
    ctx.save();
    const fw=L.rt*2.06, fx=L.cx-fw/2, fy=L.top-L.h*.018, fh=L.h*.042;
    ctx.globalAlpha=.9;
    const fg=ctx.createLinearGradient(fx,0,fx+fw,0);
    fg.addColorStop(0,"#d8d0c4"); fg.addColorStop(.35,"#fdfaf4"); fg.addColorStop(1,"#cfc7ba");
    ctx.fillStyle=fg; rrect(fx,fy,fw,fh,fh*.45); ctx.fill();
    if(S.pierceP>0){                              // รอยบุ๋ม
      ctx.globalAlpha=clamp(S.pierceP,0,1)*.6; ctx.fillStyle="#7a6f60";
      ctx.beginPath(); ctx.ellipse(st.x, fy+fh/2, L.h*.03*S.pierceP, fh*.42*S.pierceP,0,0,7); ctx.fill();
    }
    ctx.restore();
  }

  /* กระจกหน้า + ขอบแก้ว */
  ctx.save(); cupPath(0); ctx.clip();
  const gl=ctx.createLinearGradient(L.cx-L.rt,0,L.cx+L.rt,0);
  gl.addColorStop(0,"rgba(255,255,255,.22)"); gl.addColorStop(.16,"rgba(255,255,255,.04)");
  gl.addColorStop(.72,"rgba(255,255,255,0)"); gl.addColorStop(.93,"rgba(255,255,255,.17)");
  ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.35; ctx.fillStyle="#fff";
  rrect(L.cx-L.rt*.74, L.top+L.h*.07, L.h*.022, L.h*.5, L.h*.012); ctx.fill();
  ctx.globalAlpha=1; ctx.restore();

  ctx.save(); cupPath(0); ctx.lineWidth=Math.max(1.4,L.h*.006);
  ctx.strokeStyle="rgba(255,255,255,.32)"; ctx.stroke(); ctx.restore();
  ctx.restore(); // untilt
}

/* ═════════════════════ 7. LOOP ═════════════════════ */
let prev=performance.now();
function loop(now){
  const dt=Math.min((now-prev)/1000,.05); prev=now; S.t+=dt;

  sh.e=Math.max(0, sh.e-dt*1.9);
  sh.vx*=Math.exp(-dt*7);
  sh.tilt+=((clamp(sh.vx*.0022,-.15,.15))-sh.tilt)*Math.min(1,dt*11);

  if(S.phase==="shake"&&sh.e>.02&&!reduceMo){
    for(const p of pearls){ p.vy-=sh.e*L.h*rnd(.9,1.8)*dt; p.vx+=rnd(-1,1)*sh.e*L.h*2.2*dt; }
  }

  if(S.phase==="pierce"){
    S.pierceP += S.hold ? dt*0.82 : -dt*0.9;
    S.pierceP = clamp(S.pierceP,0,1);
    if(S.hold && Math.random()<dt*14) Snd.shake();
    if(S.pierceP>=1) goSip();
  }

  if(S.phase==="sip"){
    const target=S.hold?1:0;
    S.sipPow += (target-S.sipPow)*Math.min(1, dt*(S.hold?3.1:4.4));
    const e=ease(clamp(S.sipPow,0,1));
    Snd.sipLevel(e);
    if(e>.04){
      S.fill=Math.max(0, S.fill - dt*0.082*e);
      const sy=surfY(), st=strawGeo();
      for(const p of pearls){                     // ดูดไข่มุกเข้าหลอด
        if(p.gone||p.suck) continue;
        if(p.y>sy-L.h*.02 && Math.hypot(p.x-st.x, p.y-st.botY)<L.h*.12*(0.5+e)){
          p.suck=0.001; p.x0=p.x; p.y0=p.y;
        }
      }
      if(navigator.vibrate && Math.random()<dt*3) navigator.vibrate(6);
    }
    if(S.t-S.comboT>1.5 && S.combo){ S.combo=0; $("#comboNum").textContent="0"; $("#combo").classList.remove("on"); }
    if(S.fill<=.015) finish();
  }

  stepPearls(dt);
  draw();
  syncHud();
  requestAnimationFrame(loop);
}

/* ═════════════════════ 8. PHASES ═════════════════════ */
function addShake(dx,dy){
  if(S.phase!=="shake") return;
  const v=Math.hypot(dx,dy); if(v<1.5) return;
  const d=Math.sign(dx)||Math.sign(dy);
  if(d && d!==sh.dir){ sh.rev++; sh.dir=d; }
  sh.e=clamp(sh.e+Math.min(v,90)/620, 0, 1);
  sh.vx+=dx*0.9;
  const bonus=1+Math.min(sh.rev,14)*0.045;         // เขย่าสลับทิศ = ได้โบนัส
  S.mix=clamp(S.mix + Math.min(v,70)/70*0.0115*bonus, 0, 1);
  if(S.t-sh.last>0.09){ sh.last=S.t; Snd.shake(); navigator.vibrate&&navigator.vibrate(12); }
  if(S.mix>=1 && !S.shakeReady){
    S.shakeReady=true; float("เข้ากันแล้ว!",L.cx,L.top+L.h*.3,"var(--ok)"); Snd.ding();
    setTimeout(goPierce,550);
  }
}
function goShake(){
  S.phase="shake"; sh.rev=0; S.shakeReady=false; buildPearls();
  setPanel("play"); $("#act").textContent="เขย่า! 🫨";
  setTip("ลากนิ้วซ้าย-ขวาบนแก้ว หรือเขย่ามือถือจริงๆ");
  if(typeof DeviceMotionEvent!=="undefined" && typeof DeviceMotionEvent.requestPermission==="function"){
    DeviceMotionEvent.requestPermission().then(r=>{ if(r==="granted") hookMotion(); }).catch(()=>{});
  } else hookMotion();
}
function goPierce(){
  S.phase="pierce"; S.pierceP=0; setPanel("play");
  $("#act").textContent="กดค้างเพื่อเจาะ 🥤"; setTip("กดค้างที่ปุ่มหรือบนแก้ว จนฟิล์มทะลุ");
}
function goSip(){
  S.phase="sip"; S.pierceP=1; Snd.pop(); Snd.sipStart();
  navigator.vibrate&&navigator.vibrate([18,40,28]);
  float("ทะลุ!",L.cx,L.top+L.h*.18,"var(--acc)");
  setPanel("play"); $("#act").textContent="กดค้างเพื่อดูด 😋";
  setTip("กดค้าง = ดูด • ปล่อย = พัก • ดูดตอนไข่มุกลอยมา จะได้คอมโบ");
}
function finish(){
  if(S.phase==="done") return;
  S.phase="done"; S.fill=0; S.hold=false; S.sipPow=0; Snd.sipStop(); Snd.ding();
  const st=S.stats;
  st.cups++; st.best=Math.max(st.best,S.comboBest); st.kcal+=kcalOf(); st.spent+=priceOf();
  localStorage.setItem("bobaStats",JSON.stringify(st));
  setPanel("done"); renderReceipt(); $("#act").textContent="ทำแก้วใหม่ 🧋";
  setTip("หมดแก้ว! เก่งมาก 🎉");
  float("หมดแก้ว! 🎉",L.cx,L.top+L.h*.35,"var(--gold)");
}
function reset(){
  Object.assign(S,{phase:"build",mix:0,pierceP:0,fill:1,combo:0,comboBest:0,eaten:0,
    sipPow:0,hold:false,shakeReady:false,step:0});
  sh.e=sh.vx=sh.tilt=sh.rev=0; Snd.sipStop();
  pearls=[];ices=[]; $("#comboNum").textContent="0"; $("#combo").classList.remove("on");
  $("#deliverBox").classList.add("hidden");
  setPanel("build"); $("#act").textContent="ปิดฝา & เขย่า"; setTip("");
  renderSteps(); renderPanes(); syncUI();
}

/* ═════════════════════ 9. UI ═════════════════════ */
function setTip(t){const e=$("#tip"); e.textContent=t; e.classList.toggle("on",!!t);}
function setPanel(m){
  $("#build").classList.toggle("hidden",m!=="build");
  $("#play").classList.toggle("hidden",m!=="play");
  $("#done").classList.toggle("hidden",m!=="done");
  $("#bill").classList.toggle("hidden",m!=="build");
}
const STEP_NAMES=["รสชาติ","ขนาด","หวาน/น้ำแข็ง","ท็อปปิ้ง","สรุป"];
function renderSteps(){
  $("#steps").innerHTML=STEP_NAMES.map((n,i)=>
    `<button data-s="${i}" class="${i===S.step?"on":""}">${i+1}. ${n}</button>`).join("");
}
function renderPanes(){
  const f=FLAVORS, p=[];
  p[0]=`<div class="sec"><h3>เลือกรสชาติ</h3><div class="grid g2">`+
    f.map((x,i)=>`<button class="chip" data-k="flavor" data-v="${i}">
      <span class="dot" style="background:${x.c}"></span>${x.n}<span class="sub">฿${x.p}</span></button>`).join("")+
    `</div></div>`;
  p[1]=`<div class="sec"><h3>ขนาดแก้ว</h3><div class="grid g4">`+
    SIZES.map((x,i)=>`<button class="chip" data-k="size" data-v="${i}">
      <b style="font-size:var(--fs-lg)">${x.n}</b><span class="sub">${x.o}</span></button>`).join("")+
    `</div></div>`;
  p[2]=`<div class="sec"><h3>ระดับความหวาน</h3><div class="grid g3">`+
    SWEET.map((x,i)=>`<button class="chip" data-k="sweet" data-v="${i}">${x}%</button>`).join("")+
    `</div></div><div class="sec"><h3>น้ำแข็ง</h3><div class="grid g4">`+
    ICE.map((x,i)=>`<button class="chip" data-k="ice" data-v="${i}">${x.n}</button>`).join("")+`</div></div>`;
  p[3]=`<div class="sec"><h3>ท็อปปิ้ง (เลือกได้หลายอย่าง)</h3><div class="grid g2">`+
    TOPS.map((x,i)=>`<button class="chip" data-k="top" data-v="${i}">
      ${x.e} ${x.n}<span class="sub">+฿${x.p} · ${x.k} kcal</span></button>`).join("")+`</div></div>`;
  p[4]=`<div class="sec"><h3>สรุปแก้วของคุณ</h3><div class="card" id="sum"></div>
      <p class="muted" style="font-size:var(--fs-sm)">พร้อมแล้วกด “ปิดฝา &amp; เขย่า” ด้านล่างได้เลย</p></div>`;
  $("#panes").innerHTML=p.map((h,i)=>`<div data-pane="${i}">${h}</div>`).join("");
}
function syncUI(){
  document.querySelectorAll("#steps button").forEach(b=>b.classList.toggle("on",+b.dataset.s===S.step));
  document.querySelectorAll("[data-pane]").forEach(d=>d.classList.toggle("hidden",+d.dataset.pane!==S.step));
  document.querySelectorAll(".chip").forEach(c=>{
    const k=c.dataset.k, v=+c.dataset.v;
    c.classList.toggle("on", k==="top" ? S.tops.has(v) : S[k]===v);
  });
  const f=FLAVORS[S.flavor], z=SIZES[S.size];
  $("#pPrice").textContent="฿"+priceOf();
  $("#pKcal").textContent=kcalOf()+" kcal";
  $("#pName").innerHTML=`${f.e} ${f.n}<br>${z.n} · หวาน ${SWEET[S.sweet]}% · น้ำแข็ง${ICE[S.ice].n}`;
  const sum=$("#sum");
  if(sum) sum.innerHTML=[
    ["รสชาติ",`${f.e} ${f.n}`],["ขนาด",`${z.n} (${z.o})`],
    ["ความหวาน",SWEET[S.sweet]+"%"],["น้ำแข็ง",ICE[S.ice].n],
    ["ท็อปปิ้ง",activeTops().map(t=>t.n).join(", ")||"ไม่ใส่"],
    ["ราคา","฿"+priceOf()],["พลังงาน",kcalOf()+" kcal"]
  ].map(([a,b])=>`<div class="row"><span class="muted">${a}</span><b>${b}</b></div>`).join("");
}
function syncHud(){
  let pct=0,txt="";
  if(S.phase==="build"){pct=(S.step+1)/5*100; txt=`ขั้นที่ ${S.step+1}/5`;}
  else if(S.phase==="shake"){pct=S.mix*100; txt=`เขย่า ${Math.round(S.mix*100)}%`;}
  else if(S.phase==="pierce"){pct=S.pierceP*100; txt=`เจาะฟิล์ม ${Math.round(S.pierceP*100)}%`;}
  else if(S.phase==="sip"){pct=(1-S.fill)*100; txt=`ดูดไป ${Math.round((1-S.fill)*100)}%`;}
  else {pct=100; txt="เสร็จแล้ว!";}
  $("#mBar").style.width=pct+"%"; $("#mTxt").textContent=txt;

  const showRing=(S.phase==="shake"||S.phase==="pierce");
  $("#ringWrap").classList.toggle("on",showRing);
  if(showRing){
    const v=S.phase==="shake"?S.mix:S.pierceP;
    $("#ring .arc").style.strokeDashoffset=276.5*(1-clamp(v,0,1));
    $("#ring .arc").style.stroke=S.phase==="pierce"?"var(--gold)":"var(--acc)";
    $("#ringTxt").textContent=Math.round(v*100)+"%";
  }
  if(S.phase==="pierce") $("#act").style.setProperty("--p",S.pierceP);
  if(S.phase==="sip"&&S.t%0.25<0.02){
    $("#liveStats").innerHTML=[
      ["เหลือในแก้ว",Math.round(S.fill*100)+"%"],["ไข่มุกที่กิน",S.eaten+" เม็ด"],
      ["คอมโบสูงสุด","×"+S.comboBest]
    ].map(([a,b])=>`<div class="row"><span class="muted">${a}</span><b>${b}</b></div>`).join("");
  }
}
function renderReceipt(){
  const f=FLAVORS[S.flavor], st=S.stats;
  $("#receipt").innerHTML=`<h3 style="margin-bottom:10px">🧾 ใบเสร็จ</h3>`+[
    ["เมนู",`${f.e} ${f.n}`],["ขนาด",SIZES[S.size].n],
    ["ไข่มุกที่กิน",S.eaten+" เม็ด"],["คอมโบสูงสุด","×"+S.comboBest],
    ["ราคา","฿"+priceOf()],["พลังงาน",kcalOf()+" kcal"],
    ["—","—"],["แก้วสะสม",st.cups+" แก้ว"],["สถิติคอมโบ","×"+st.best]
  ].filter(r=>r[0]!=="—").map(([a,b])=>
    `<div class="row"><span class="muted">${a}</span><b>${b}</b></div>`).join("");
}

/* ═════════════════════ 10. INPUT ═════════════════════ */
const stage=$("#stage"); let last=null;
function down(e){
  Snd.init(); S.hold=true; last={x:e.clientX,y:e.clientY};
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
}
function move(e){
  if(!S.hold||!last) return;
  const dx=e.clientX-last.x, dy=e.clientY-last.y;
  last={x:e.clientX,y:e.clientY};
  addShake(dx,dy);
}
function up(){S.hold=false; last=null; $("#act").style.setProperty("--p",0);}
stage.addEventListener("pointerdown",down);
stage.addEventListener("pointermove",move);
addEventListener("pointerup",up); addEventListener("pointercancel",up);
addEventListener("blur",up);
document.addEventListener("visibilitychange",()=>{if(document.hidden)up()});
addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat){e.preventDefault();Snd.init();S.hold=true}});
addEventListener("keyup",e=>{if(e.code==="Space")up()});

let motionOn=false;
function hookMotion(){
  if(motionOn) return; motionOn=true;
  addEventListener("devicemotion",e=>{
    if(S.phase!=="shake") return;
    const a=e.accelerationIncludingGravity; if(!a) return;
    addShake((a.x||0)*2.4,(a.y||0)*1.2);
  });
}

/* ปุ่มหลักบนเวที */
const act=$("#act");
act.addEventListener("pointerdown",e=>{e.stopPropagation();Snd.init();S.hold=true});
act.addEventListener("pointerup",e=>{e.stopPropagation();up()});
act.addEventListener("click",()=>{
  if(S.phase==="build") goShake();
  else if(S.phase==="done") reset();
});

/* แผงควบคุม */
$("#steps").addEventListener("click",e=>{
  const b=e.target.closest("button[data-s]"); if(!b) return;
  S.step=+b.dataset.s; syncUI();
});
$("#panes").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const k=c.dataset.k, v=+c.dataset.v;
  if(k==="top"){ S.tops.has(v)?S.tops.delete(v):S.tops.add(v); }
  else { S[k]=v; if(S.step<4) setTimeout(()=>{S.step=Math.min(S.step+1,4);syncUI()},160); }
  Snd.init(); Snd.blop(3); navigator.vibrate&&navigator.vibrate(8);
  syncUI();
});
$("#btnGo").addEventListener("click",()=>{Snd.init();goShake()});
$("#btnAgain").addEventListener("click",reset);
$("#btnReset").addEventListener("click",reset);
$("#btnSfx").addEventListener("click",e=>{e.currentTarget.textContent=Snd.toggle()?"🔊":"🔇"});

/* ═════════════════════ 11. SHARE / DELIVER ═════════════════════ */
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>new TextDecoder().decode(Uint8Array.from(
  atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0)));

$("#btnShare").addEventListener("click",async()=>{
  const code=b64e(JSON.stringify([S.flavor,S.size,S.sweet,S.ice,[...S.tops]]));
  const url=location.origin+location.pathname+"#r="+code;
  $("#shLink").value=url;
  if(navigator.share){ try{ await navigator.share({title:"สูตรชานมของฉัน",url}); return; }catch(_){} }
  $("#modal").showModal();
});
$("#shCopy").addEventListener("click",async()=>{
  try{ await navigator.clipboard.writeText($("#shLink").value); toast("คัดลอกแล้ว ✓"); }
  catch(_){ $("#shLink").select(); document.execCommand("copy"); toast("คัดลอกแล้ว ✓"); }
});
$("#shClose").addEventListener("click",()=>$("#modal").close());

$("#btnDeliver").addEventListener("click",()=>{
  const box=$("#deliverBox"); box.classList.remove("hidden");
  const steps=["📝 ร้านรับออเดอร์แล้ว","🧋 กำลังชงแก้วของคุณ","🛵 ไรเดอร์รับของแล้ว","🚦 กำลังมาส่ง","🎉 ถึงแล้ว!"];
  let i=0;
  const tick=()=>{
    box.innerHTML=`<h3 style="margin-bottom:10px">สถานะออเดอร์</h3>`+
      steps.map((s,j)=>`<div class="row"><span class="${j<=i?"":"muted"}">${s}</span>
        <b>${j<i?"✓":j===i?"…":""}</b></div>`).join("")+
      `<div class="meter" style="margin-top:12px;max-width:none"><i style="width:${(i+1)/steps.length*100}%"></i></div>`;
    if(i<steps.length-1){ i++; setTimeout(tick,1800); } else { Snd.ding(); toast("ส่งถึงแล้ว 🎉"); }
  };
  tick();
});

/* ═════════════════════ 12. BOOT ═════════════════════ */
function loadShared(){
  const m=location.hash.match(/r=([\w-]+)/); if(!m) return;
  try{
    const [f,z,sw,ic,tp]=JSON.parse(b64d(m[1]));
    if(FLAVORS[f]) S.flavor=f; if(SIZES[z]) S.size=z;
    if(SWEET[sw]!==undefined) S.sweet=sw; if(ICE[ic]) S.ice=ic;
    if(Array.isArray(tp)) S.tops=new Set(tp.filter(i=>TOPS[i]));
    S.step=4; $("#banner").classList.add("on");
  }catch(_){}
}
loadShared(); renderSteps(); renderPanes(); syncUI(); setPanel("build");
fit(); requestAnimationFrame(loop);
addEventListener("load",()=>{ fit(); setTimeout(()=>$("#boot").classList.add("off"),260); });
setTimeout(()=>$("#boot").classList.add("off"),1200);
setTip("เลือกสูตรทางขวา แล้วกดปิดฝา");
})();
</script>
</body>
